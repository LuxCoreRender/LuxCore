film.width = 1280
film.height = 720
batch.halttime = 0
scene.file = scene.scn
screen.imagepipeline.index = 1
context.verbose = 0
renderengine.type = PATHOCL
accelerator.type = OPTIX
opencl.cpu.use = 0
opencl.gpu.use = 1
opencl.native.threads.count = 0
# Keep HDR and EXR image maps at their native source resolution.
scene.images.resizepolicy.type = NONE
# Keep film processing on the host so the controller can read raw/OIDN output.
film.hw.enable = 0
# Film image pipeline plug-ins
# Pipeline 0: LuxLinear camera-style tonemapper
film.imagepipelines.0.0.type = TONEMAP_LUXLINEAR
film.imagepipelines.0.0.sensitivity = 100
film.imagepipelines.0.0.exposure = 5.0
film.imagepipelines.0.0.fstop = 2.8
film.imagepipelines.0.1.type = GAMMA_CORRECTION
film.imagepipelines.0.1.value = 2.2

# Pipeline 1: OIDN denoised output
film.imagepipelines.1.0.type = INTEL_OIDN
film.imagepipelines.1.1.type = TONEMAP_LUXLINEAR
film.imagepipelines.1.1.sensitivity = 100
film.imagepipelines.1.1.exposure = 5.0
film.imagepipelines.1.1.fstop = 2.8
film.imagepipelines.1.2.type = GAMMA_CORRECTION
film.imagepipelines.1.2.value = 2.2

# Outputs
film.outputs.1.type = RGB_IMAGEPIPELINE
film.outputs.1.index = 0
film.outputs.1.filename = render.png
film.outputs.2.type = RGB_IMAGEPIPELINE
film.outputs.2.index = 0
film.outputs.2.filename = render.exr
film.outputs.3.type = RGB_IMAGEPIPELINE
film.outputs.3.index = 1
film.outputs.3.filename = denoised.png
film.outputs.4.type = RGB_IMAGEPIPELINE
film.outputs.4.index = 1
film.outputs.4.filename = denoised.exr
film.outputs.5.type = ALBEDO
film.outputs.5.filename = ALBEDO.exr
film.outputs.6.type = AVG_SHADING_NORMAL
film.outputs.6.filename = AVG_SHADING_NORMAL.exr
